<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenalezena | GRAFIKAPRODUKCE</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/logo.png" type="image/png" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --accent: #c5b396;
      --accent-soft: rgba(197, 179, 150, 0.7);
      --font: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--accent);
      font-family: var(--font);
      font-weight: 300;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.75;
    }

    :focus {
      outline: none;
    }

    :focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 3px;
    }

    .wrap {
      width: min(40rem, calc(100% - 48px));
      margin: 0 auto;
      padding: clamp(48px, 6.7vw, 128px) 0 80px;
    }

    .logo {
      display: inline-block;
    }

    .logo img {
      display: block;
      width: clamp(168px, 13.5vw, 260px);
      height: auto;
    }

    h1 {
      margin: 2.4rem 0 0.55rem;
      font-size: clamp(18px, 1.4vw, 22px);
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.3;
    }

    p {
      margin: 0;
      max-width: 36em;
      color: var(--accent-soft);
    }

    .links {
      margin-top: 1.4rem;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .links .sep {
      opacity: 0.65;
      padding: 0 0.35em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="logo" href="/">
      <img src="/assets/logo.png" alt="GRAFIKAPRODUKCE" width="260" height="123" />
    </a>
    <h1>Stránka nenalezena</h1>
    <p>Tuto adresu jsme nenašli.</p>
    <p class="links">
      <a href="/">úvodní stránka</a><span class="sep" aria-hidden="true">|</span><a href="/#kontakt">kontakt</a>
    </p>
  </main>
</body>
</html>
