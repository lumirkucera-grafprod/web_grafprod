<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-mailový podpis — GRAFIKAPRODUKCE</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://www.grafikaprodukce.cz/podpis/" />
  <link rel="icon" href="/assets/logo.png" type="image/png" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --accent: #c5b396;
      --accent-soft: rgba(197, 179, 150, 0.7);
      --line: rgba(197, 179, 150, 0.4);
      --font: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--accent);
      font-family: var(--font);
      font-weight: 300;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    .wrap {
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    .mark {
      margin: 0 0 36px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-decoration: none;
    }

    .mark:hover {
      opacity: 0.75;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .lead,
    .note {
      margin: 0;
      max-width: 42em;
      color: var(--accent-soft);
      font-size: 14px;
    }

    h2 {
      margin: 36px 0 12px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    .card {
      background: #fff;
      padding: 28px 32px 24px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 0.72em 1.25em;
      border: 1px solid var(--accent);
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #copy-rich {
      background: var(--accent);
      color: #000;
    }

    #copy-html {
      background: transparent;
      color: var(--accent);
    }

    .status {
      min-height: 1.4em;
      margin: 12px 0 0;
      font-size: 13px;
      font-weight: 400;
    }

    .status[data-tone="error"] {
      color: #e7c7c7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 400;
      color: var(--accent-soft);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 280px;
      margin: 0;
      padding: 16px 18px;
      resize: vertical;
      border: 1px solid var(--line);
      background: #111;
      color: #f3efe8;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    :focus {
      outline: none;
    }

    :focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      .wrap {
        width: min(720px, calc(100% - 28px));
        padding-top: 36px;
      }

      h1 {
        font-size: 24px;
      }

      .card {
        padding: 20px 16px 16px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="mark"><a href="/">GRAFIKAPRODUKCE</a></p>
    <h1>E-mailový podpis</h1>
    <p class="lead">Podpis pro e-mail Lumíra Kučery. Náhled je připravený ke vložení do Roundcube.</p>

    <h2>Náhled</h2>
    <div class="card" id="signature-preview"></div>

    <div class="actions">
      <button type="button" id="copy-rich">Kopírovat podpis</button>
      <button type="button" id="copy-html">Kopírovat HTML</button>
    </div>
    <p class="status" id="copy-status" role="status" aria-live="polite"></p>
    <p class="note">Kopírovat podpis vloží naformátovaný podpis včetně obrázku do editoru. Kopírovat HTML zkopíruje zdrojový kód. V Roundcube: Nastavení → Identity → Podpis.</p>

    <h2>HTML kód</h2>
    <label for="signature-html">Zdrojový kód podpisu</label>
    <textarea id="signature-html" readonly spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </div>

  <script type="text/plain" id="signature-source">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
  <tr>
    <td style="padding:0 0 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;font-weight:bold;color:#333333;">Lumír Kučera</td>
  </tr>
  <tr>
    <td style="padding:0 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#333333;">tel: <a href="tel:+420732828692" style="color:#333333;text-decoration:none;">732&nbsp;828&nbsp;692</a> | <a href="https://www.grafikaprodukce.cz/" style="color:#333333;text-decoration:none;">www.grafikaprodukce.cz</a></td>
  </tr>
  <tr>
    <td style="padding:0;line-height:0;font-size:0;">
      <img src="https://www.grafikaprodukce.cz/podpis/podpis-logo.jpg" alt="GRAFIKAPRODUKCE" width="360" height="78" border="0" style="display:block;border:0;outline:none;text-decoration:none;width:360px;max-width:100%;height:auto;" />
    </td>
  </tr>
</table>
  </script>

  <script>
    (function () {
      var html = document.getElementById("signature-source").textContent.trim();
      var preview = document.getElementById("signature-preview");
      var field = document.getElementById("signature-html");
      var status = document.getElementById("copy-status");
      var plain = "Lumír Kučera\ntel: 732 828 692 | www.grafikaprodukce.cz";

      field.value = html;
      preview.innerHTML = html;

      function setStatus(message, isError) {
        status.textContent = message;
        if (isError) status.setAttribute("data-tone", "error");
        else status.setAttribute("data-tone", "ok");
      }

      function copyWithSelection(node) {
        var range = document.createRange();
        range.selectNodeContents(node);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        var ok = document.execCommand("copy");
        selection.removeAllRanges();
        if (!ok) throw new Error("copy failed");
      }

      async function copyHtml() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(field.value);
          return;
        }
        field.removeAttribute("readonly");
        field.focus();
        field.select();
        var ok = document.execCommand("copy");
        field.setAttribute("readonly", "");
        window.getSelection().removeAllRanges();
        if (!ok) throw new Error("copy failed");
      }

      async function copyRich() {
        if (navigator.clipboard && window.ClipboardItem) {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({
                "text/html": new Blob([field.value], { type: "text/html" }),
                "text/plain": new Blob([plain], { type: "text/plain" })
              })
            ]);
            return;
          } catch (err) {
            /* selection fallback below */
          }
        }
        copyWithSelection(preview);
      }

      document.getElementById("copy-rich").addEventListener("click", function () {
        copyRich().then(function () {
          setStatus("Podpis byl zkopírován do schránky.");
        }).catch(function () {
          setStatus("Kopírování se nepovedlo. Označte náhled a zkopírujte ho ručně.", true);
        });
      });

      document.getElementById("copy-html").addEventListener("click", function () {
        copyHtml().then(function () {
          setStatus("HTML kód byl zkopírován do schránky.");
        }).catch(function () {
          setStatus("Kopírování se nepovedlo. Označte kód v poli a zkopírujte ho ručně.", true);
        });
      });
    })();
  </script>
</body>
</html>
